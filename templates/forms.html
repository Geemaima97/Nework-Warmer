{% extends "base.html" %}

{% block content %}
    <h1>Networking Profile Form</h1>
    <form action="/submit-profile" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">   
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required maxlength="100"><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required maxlength="50"><br>
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required maxlength="15"><br>
    <label for="career">Career:</label>
    <input type="text" id="career" name="career" maxlength="100"><br>
    <label for="role">Role:</label>
    <input type="text" id="role" name="role" maxlength="100"><br>
    
    <div id="spinner" style="display:none;">
        ⏳ Analyzing your profile...
    </div>
    <input type="submit" value="Submit">

    </form>
    
    <script>
    document.querySelector('form').addEventListener('submit', function() {
        document.getElementById('spinner').style.display = 'block';
        document.querySelector('input[type="submit"]').style.display = 'none';
    });
    </script>
    
{% endblock %}
