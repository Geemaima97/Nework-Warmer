<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Register</h1>
    <form action="/register" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required maxlength="50"><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required maxlength="50"><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required minlength="6"><br>
    <label for="confirm_password">Confirm Password:</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6"><br>
    <input type="submit" value="Register">
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
</html>
