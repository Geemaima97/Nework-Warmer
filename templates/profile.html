{% extends "base.html" %}

{% block content %}
<div class="profile-card">
    <h1>My Profile</h1>
    <p><strong>Name:</strong> {{ profile[0] }}</p>
    <p><strong>Email:</strong> {{ profile[1] }}</p>
    <p><strong>Phone:</strong> {{ profile[2] }}</p>
    <p><strong>Career:</strong> {{ profile[3] }}</p>
    <p><strong>Role:</strong> {{ profile[4] }}</p>
    <p><strong>Industry:</strong> {{ profile[5] }}</p>
    <p><strong>Looking For:</strong> {{ profile[6] }}</p>
</div>


{% endblock %}
