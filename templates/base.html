<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetWorth{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
</head>
<body>
<nav>
    <a href="/" class="nav-brand">NetWorth</a>

    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <ul class="nav-links" id="nav-links">
        {% if session['email'] %}
            <li class="nav-user">👤 {{ session['username'] }}</li>
            <li><a href="/profile">Profile</a></li> 
            <li><a href="/matches">Matches</a></li>     
            <li><a href="/logout">Logout</a></li>
        {% else %}
            <li><a href="/login">Login</a></li>
            <li><a href="/register">Register</a></li>
        {% endif %}
    </ul>
</nav>
     <div id="loading-overlay" style="display:none; text-align:center; padding:40px; font-size:1.2em; color:purple;">
    ⏳ Finding your matches...
     </div>
{% block content %}{% endblock %}


<script>
function toggleMenu() {
    const navLinks = document.getElementById('nav-links');
    navLinks.classList.toggle('active');
}

document.querySelector('a[href="/matches"]').addEventListener('click', function() {
    document.getElementById('loading-overlay').style.display = 'block';
});
</script>




    
</body>
</html>
